<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>تسجيل الدخول — حملة سيارة إسعاف الظاهرية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="login-page">
    <div class="login-card fade-up">
      <div class="brand-mark">إ</div>
      <h1>لوحة إدارة الحملة</h1>
      <p>حملة التبرعات لشراء سيارة إسعاف لمدينة الظاهرية</p>

      <div id="alert" class="alert"></div>

      <form id="loginForm">
        <div class="field">
          <label for="username">اسم المستخدم</label>
          <input id="username" name="username" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">كلمة المرور</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </div>
        <button class="btn btn-gold btn-block" type="submit">دخول</button>
      </form>

      <p style="margin-top: 20px; font-size: 0.85rem;">
        <a href="/" style="color: var(--gold);">← العودة إلى الشاشة العامة</a>
      </p>
    </div>
  </div>

  <script src="/js/shared.js"></script>
  <script>
    const next = new URLSearchParams(location.search).get("next") || "/admin";
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const alertEl = document.getElementById("alert");
      App.hideAlert(alertEl);
      try {
        await App.api("/api/login", {
          method: "POST",
          body: {
            username: document.getElementById("username").value.trim(),
            password: document.getElementById("password").value,
          },
        });
        location.href = next.startsWith("/") ? next : "/admin";
      } catch (err) {
        App.alertBox(alertEl, "err", err.message);
      }
    });
  </script>
</body>
</html>
