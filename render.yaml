databases:
  - name: icu-db
    plan: free
    databaseName: icu
    user: icu

services:
  - type: web
    name: icu-campaign
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/campaign
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: icu-db
          property: connectionString
      - key: NODE_VERSION
        value: "20"
